services:
  ecomint:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecomint:latest
    container_name: ecomint
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-cb1710-2.myshopify.com}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${SHOPIFY_ADMIN_ACCESS_TOKEN:-}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-07}
      SHOPIFY_LOCATION_ID: ${SHOPIFY_LOCATION_ID:-}
      SOURCE_URL_ALLOWLIST: ${SOURCE_URL_ALLOWLIST:-}
      DATABASE_PATH: /app/data/ecomint.db
      PRODUCT_IMAGE_DIRECTORY: /app/productimage
      LOG_DIRECTORY: /app/logs
      MAX_IMPORT_ROWS: ${MAX_IMPORT_ROWS:-10000}
      SOURCE_REQUEST_TIMEOUT_MS: ${SOURCE_REQUEST_TIMEOUT_MS:-12000}
      SOURCE_MAX_REDIRECTS: ${SOURCE_MAX_REDIRECTS:-3}
      SOURCE_MAX_RESPONSE_BYTES: ${SOURCE_MAX_RESPONSE_BYTES:-5242880}
      SOURCE_CATALOG_ENDPOINT: ${SOURCE_CATALOG_ENDPOINT:-/rest/V1/product/getAllProduct}
      SOURCE_CATALOG_MAX_RESPONSE_BYTES: ${SOURCE_CATALOG_MAX_RESPONSE_BYTES:-52428800}
      SOURCE_DESCRIPTION_ENDPOINT: ${SOURCE_DESCRIPTION_ENDPOINT:-/rest/V1/product-description}
      IMAGE_REQUEST_TIMEOUT_MS: ${IMAGE_REQUEST_TIMEOUT_MS:-15000}
      IMAGE_MAX_REDIRECTS: ${IMAGE_MAX_REDIRECTS:-3}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-15728640}
      IMAGE_DOWNLOAD_CONCURRENCY: ${IMAGE_DOWNLOAD_CONCURRENCY:-3}
    volumes:
      - ecomint-data:/app/data
      - ecomint-logs:/app/logs
      - ecomint-images:/app/productimage
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  ecomint-data:
  ecomint-logs:
  ecomint-images:
